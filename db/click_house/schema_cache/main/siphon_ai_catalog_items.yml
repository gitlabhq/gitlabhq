---
name: siphon_ai_catalog_items
engine: ReplacingMergeTree
engine_full: ReplacingMergeTree(_siphon_replicated_at, _siphon_deleted) PRIMARY KEY
  (traversal_path, id) ORDER BY (traversal_path, id) SETTINGS index_granularity =
  2048
primary_key: traversal_path, id
sorting_key: traversal_path, id
settings:
  index_granularity: '2048'
columns:
- name: id
  type: Int64
  compression_codec: CODEC(DoubleDelta, ZSTD(1))
  is_in_sorting_key: true
  is_in_primary_key: true
- name: organization_id
  type: Int64
- name: project_id
  type: Nullable(Int64)
- name: created_at
  type: DateTime64(6, 'UTC')
  compression_codec: CODEC(Delta(8), ZSTD(1))
- name: updated_at
  type: DateTime64(6, 'UTC')
  compression_codec: CODEC(Delta(8), ZSTD(1))
- name: item_type
  type: Int16
- name: description
  type: String
- name: name
  type: String
- name: public
  type: Bool
  default_kind: DEFAULT
  default_expression: 'false'
  compression_codec: CODEC(ZSTD(1))
- name: deleted_at
  type: Nullable(DateTime64(6, 'UTC'))
- name: latest_version_id
  type: Nullable(Int64)
- name: latest_released_version_id
  type: Nullable(Int64)
- name: verification_level
  type: Int16
  default_kind: DEFAULT
  default_expression: '0'
- name: identifier
  type: Nullable(String)
- name: foundational_flow_reference
  type: Nullable(String)
- name: last_30_day_usage_count
  type: Int64
  default_kind: DEFAULT
  default_expression: '0'
- name: last_30_day_usage_count_updated_at
  type: DateTime64(6, 'UTC')
  default_kind: DEFAULT
  default_expression: "'1970-01-01 00:00:00'"
- name: star_count
  type: Int64
  default_kind: DEFAULT
  default_expression: '0'
- name: visibility
  type: Int16
  default_kind: DEFAULT
  default_expression: '0'
- name: traversal_path
  type: String
  default_kind: DEFAULT
  default_expression: multiIf(coalesce(organization_id, 0) != 0, dictGetOrDefault('organization_traversal_paths_dict',
    'traversal_path', organization_id, '0/'), '0/')
  compression_codec: CODEC(ZSTD(3))
  is_in_sorting_key: true
  is_in_primary_key: true
- name: _siphon_replicated_at
  type: DateTime64(6, 'UTC')
  default_kind: DEFAULT
  default_expression: now64(6, 'UTC')
  compression_codec: CODEC(ZSTD(1))
- name: _siphon_deleted
  type: Bool
  default_kind: DEFAULT
  default_expression: 'false'
  compression_codec: CODEC(ZSTD(1))
- name: _siphon_watermark
  type: DateTime64(6, 'UTC')
  default_kind: DEFAULT
  default_expression: now64(6, 'UTC')
  compression_codec: CODEC(ZSTD(1))
