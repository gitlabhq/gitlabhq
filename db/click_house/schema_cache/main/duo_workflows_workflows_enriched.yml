---
name: duo_workflows_workflows_enriched
engine: ReplacingMergeTree
engine_full: ReplacingMergeTree(_version, _siphon_deleted) PRIMARY KEY (traversal_path,
  created_at, id) ORDER BY (traversal_path, created_at, id) SETTINGS index_granularity
  = 8192
primary_key: traversal_path, created_at, id
sorting_key: traversal_path, created_at, id
settings:
  index_granularity: '8192'
columns:
- name: id
  type: Int64
  compression_codec: CODEC(DoubleDelta, ZSTD(1))
  is_in_sorting_key: true
  is_in_primary_key: true
- name: user_id
  type: Int64
- name: project_id
  type: Nullable(Int64)
- name: created_at
  type: DateTime64(6, 'UTC')
  compression_codec: CODEC(Delta(8), ZSTD(1))
  is_in_sorting_key: true
  is_in_primary_key: true
- name: updated_at
  type: DateTime64(6, 'UTC')
  compression_codec: CODEC(Delta(8), ZSTD(1))
- name: status
  type: Int16
  default_kind: DEFAULT
  default_expression: '0'
- name: goal
  type: Nullable(String)
- name: agent_privileges
  type: Array(Int16)
  default_kind: DEFAULT
  default_expression: "[]"
- name: workflow_definition
  type: String
  default_kind: DEFAULT
  default_expression: "'software_development'"
- name: allow_agent_to_request_user
  type: Bool
  default_kind: DEFAULT
  default_expression: 'true'
- name: pre_approved_agent_privileges
  type: Array(Int16)
  default_kind: DEFAULT
  default_expression: "[]"
- name: image
  type: Nullable(String)
- name: environment
  type: Nullable(Int16)
- name: namespace_id
  type: Nullable(Int64)
- name: ai_catalog_item_version_id
  type: Nullable(Int64)
- name: issue_id
  type: Nullable(Int64)
- name: merge_request_id
  type: Nullable(Int64)
- name: service_account_id
  type: Nullable(Int64)
- name: tool_call_approvals
  type: String
  default_kind: DEFAULT
  default_expression: "'{}'"
- name: ai_catalog_item_id
  type: Nullable(Int64)
- name: traversal_path
  type: String
  compression_codec: CODEC(ZSTD(3))
  is_in_sorting_key: true
  is_in_primary_key: true
- name: messaging_callback_context
  type: Nullable(String)
- name: summary
  type: Nullable(String)
- name: title
  type: Nullable(String)
- name: incremental_checkpoints_enabled
  type: Nullable(Bool)
- name: agent_type
  type: Nullable(String)
- name: jsonl_sha256
  type: Nullable(String)
- name: idempotency_key
  type: Nullable(String)
- name: sync_type
  type: Nullable(Int16)
- name: agent_identity_id
  type: Nullable(Int64)
- name: web_search_enabled
  type: Bool
  default_kind: DEFAULT
  default_expression: 'false'
- name: trigger_source
  type: Int16
  default_kind: DEFAULT
  default_expression: '0'
- name: trigger_flow_trigger_id
  type: Nullable(Int64)
- name: source_type
  type: Nullable(Int16)
- name: source_link
  type: Nullable(String)
- name: execution_mode
  type: Nullable(Int16)
- name: credits_used
  type: Float64
  default_kind: DEFAULT
  default_expression: '0'
- name: model_used
  type: LowCardinality(String)
  default_kind: DEFAULT
  default_expression: "''"
- name: source_merge_request_ids
  type: Array(Int64)
  default_kind: DEFAULT
  default_expression: "[]"
- name: created_merge_request_ids
  type: Array(Int64)
  default_kind: DEFAULT
  default_expression: "[]"
- name: later_closed_merge_request_ids
  type: Array(Int64)
  default_kind: DEFAULT
  default_expression: "[]"
- name: later_merged_merge_request_ids
  type: Array(Int64)
  default_kind: DEFAULT
  default_expression: "[]"
- name: _siphon_deleted
  type: Bool
  default_kind: DEFAULT
  default_expression: 'false'
  compression_codec: CODEC(ZSTD(1))
- name: _version
  type: DateTime64(6, 'UTC')
  compression_codec: CODEC(ZSTD(1))
- name: _watermark
  type: DateTime64(6, 'UTC')
  compression_codec: CODEC(ZSTD(1))
