---
name: siphon_ai_governance_sessions
engine: ReplacingMergeTree
engine_full: ReplacingMergeTree(_siphon_replicated_at, _siphon_deleted) PRIMARY KEY
  (traversal_path, session_started_at, id) ORDER BY (traversal_path, session_started_at,
  id) SETTINGS index_granularity = 2048
primary_key: traversal_path, session_started_at, id
sorting_key: traversal_path, session_started_at, id
settings:
  index_granularity: '2048'
columns:
- name: id
  type: Int64
  compression_codec: CODEC(DoubleDelta, ZSTD(1))
  is_in_sorting_key: true
  is_in_primary_key: true
- name: namespace_id
  type: Int64
- name: project_id
  type: Nullable(Int64)
- name: user_id
  type: Int64
- name: workflow_id
  type: Nullable(Int64)
- name: created_at
  type: DateTime64(6, 'UTC')
  compression_codec: CODEC(Delta(8), ZSTD(1))
- name: updated_at
  type: DateTime64(6, 'UTC')
  compression_codec: CODEC(Delta(8), ZSTD(1))
- name: session_started_at
  type: DateTime64(6, 'UTC')
  compression_codec: CODEC(DoubleDelta, ZSTD(1))
  is_in_sorting_key: true
  is_in_primary_key: true
- name: session_finished_at
  type: Nullable(DateTime64(6, 'UTC'))
- name: source
  type: Int16
  default_kind: DEFAULT
  default_expression: '0'
- name: status
  type: Int16
  default_kind: DEFAULT
  default_expression: '0'
- name: external_xid
  type: Nullable(String)
- name: agent_type
  type: Nullable(String)
- name: flow_type
  type: Nullable(String)
- name: traversal_path
  type: String
  default_kind: DEFAULT
  default_expression: multiIf(coalesce(namespace_id, 0) != 0, dictGetOrDefault('namespace_traversal_paths_dict',
    'traversal_path', namespace_id, '0/'), '0/')
  compression_codec: CODEC(ZSTD(3))
  is_in_sorting_key: true
  is_in_primary_key: true
- name: _siphon_replicated_at
  type: DateTime64(6, 'UTC')
  default_kind: DEFAULT
  default_expression: now64(6, 'UTC')
  compression_codec: CODEC(ZSTD(1))
- name: _siphon_deleted
  type: Bool
  default_kind: DEFAULT
  default_expression: 'false'
  compression_codec: CODEC(ZSTD(1))
- name: _siphon_watermark
  type: DateTime64(6, 'UTC')
  default_kind: DEFAULT
  default_expression: now64(6, 'UTC')
  compression_codec: CODEC(ZSTD(1))
