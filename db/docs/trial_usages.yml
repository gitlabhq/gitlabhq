description: >
  Point-in-time snapshot of the seats, compute minutes and GitLab Credits a namespace used
  during a trial, captured around day 30 of the trial. Insert-only, one row per namespace
  per trial end date, read by the post-trial usage card on the group Billing page.
  Range-partitioned monthly by trial_ends_on; partitions older than 24 months are dropped.
