description: Durable, write-once record of claimed tests for parallel test balancing.
  The pending work queue lives in Redis; each claim is persisted here as one row per
  (pipeline, job group, test), stamped with the pipeline's start time as partition key
  and the claiming parallel node in node_index. Rows are read-only history used to
  replay the same set of tests on retry.
