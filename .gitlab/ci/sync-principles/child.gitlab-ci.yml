# Static template for the dynamic child pipeline generated by `ai-principles-pipeline-generate`
# (see ../sync-principles.gitlab-ci.yml).
#
# The generator emits ONLY a thin routing layer: one `distill:<principle>` job per affected principle, each extending
# `.ai-principles-distill-base` below with its principle name and a concurrency slot.
# Everything reviewable (image, before_script, timeouts, artifacts, the fan-in) lives here, in a file that shows up in
# code review like any other CI config.
#
# Shape (see gitlab-org/gitlab#607365 for the design):
#
#   distill:principle-1 ─┐
#   distill:principle-2 ─┼─ ai-principles-collect (fan-in, publishes MRs)
#   distill:principle-N ─┘
#
# The split exists to give each principle its OWN job timeout.
# Previously all principles shared one 2h budget, so a single principle burning ~20 min of retry backoff could time
# the job out and discard every other principle's completed work before publish was ever reached.

default:
  interruptible: true

workflow:
  rules:
    # A child pipeline does not inherit the parent's `auto_cancel`, so the default branch setting has to be restated
    # here.
    # Without it, the next push to master cancels distillation mid-flight and discards completed work.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
    # Catch-all: this file is only ever used as a child pipeline, triggered by the already-rules-gated
    # `ai-principles-distill` job in the parent.
    - when: always

# Backstop for the workflow rule above.
# A pipeline is only auto-cancelable when every running job is interruptible, so this protects non-default branch
# triggers too.
dont-interrupt-me:
  stage: .pre
  image: ${GITLAB_DEPENDENCY_PROXY_ADDRESS}alpine:latest
  interruptible: false
  variables:
    GIT_STRATEGY: none
  script:
    - echo "This job makes sure this pipeline won't be interrupted! See https://docs.gitlab.com/ci/yaml/#interruptible."

# A child pipeline does not inherit the parent's YAML, so the version pins and the shared before_script both have to
# be included explicitly.
include:
  - local: .gitlab/ci/version.yml
  - local: .gitlab/ci/sync-principles/setup.gitlab-ci.yml

stages:
  - distill
  - collect

variables:
  RUBY_VERSION: '${RUBY_VERSION_DEFAULT}'
  GITLAB_DEPENDENCY_PROXY_ADDRESS: '${GITLAB_DEPENDENCY_PROXY}'

# Concurrency is capped by the resource_group slots the generator assigns (`ai-principles-distill-slot-<n>`, one
# semaphore each), NOT by this template.
# The cap matches Sync::MAX_CONCURRENT_DISTILLATIONS, so the split adds zero additional load on the shared Duo Agent
# Platform scheduler; the win comes from per-job timeout isolation, not from more parallelism.
.ai-principles-distill-base:
  stage: distill
  needs: []
  image: ${GITLAB_DEPENDENCY_PROXY_ADDRESS}ruby:${RUBY_VERSION}-alpine
  # A single principle's worst case is 3 x 1500s poll timeout + 300s + 900s backoff ~= 95 min.
  # This leaves headroom above that.
  # Unlike the old shared budget, hitting it costs only this principle: the others publish regardless.
  timeout: 2h
  # Load-bearing, and the core of this whole design: a failed or timed-out distill job must NOT block the collect
  # stage, or one bad principle would again discard every other principle's completed work.
  # The run still goes red: the collect job re-raises via `abort_on_failures` once it has published what succeeded.
  allow_failure: true
  variables:
    GITLAB_TOKEN: $AGENT_PRINCIPLES_SERVICE_ACCOUNT_TOKEN
    AGENT_PRINCIPLES_CATALOG_PROJECT: gitlab-org/gitlab
    BUNDLE_PATH: vendor
    # AGENT_PRINCIPLES_CATALOG_ITEM_CONSUMER_ID is a project CI/CD variable and is exposed to child-pipeline jobs
    # automatically: DO NOT redefine it here as `$AGENT_PRINCIPLES_CATALOG_ITEM_CONSUMER_ID` (variable expansion is
    # disabled by default since GitLab 18.6, which would break the API call).
  before_script:
    - !reference [.ai-principles-setup, before_script]
  script:
    - bundle exec bin/gitlab-ai-principles-distiller-sync --workspace "$CI_PROJECT_DIR"
      --distill-one "$AI_PRINCIPLE_NAME"
  artifacts:
    # `when: always` is load-bearing, not defensive: the collect job reads the `.status` file to distinguish "failed
    # after retries" from "job never ran".
    # On failure the script writes a `failed` status and THEN exits non-zero, so dropping the artifact here would
    # silently downgrade every genuine failure to "never ran".
    when: always
    expire_in: 7d
    paths:
      - tmp/ai-principles-distilled/

# Fan-in.
# Publishing groups principles by owning team and builds each team's MR with `git checkout -B` against one shared
# working tree, so it cannot be parallelized the way distillation can: it has to be a single job.
#
# No explicit `needs:`, so it inherits the stage dependency on every distill job and receives all of their artifacts.
# `AI_PRINCIPLES_EXPECTED` is injected by the generator: collect needs the list it was SUPPOSED to receive, because an
# absent artifact only means "this job never ran" measured against an expected set.
ai-principles-collect:
  stage: collect
  image: ${GITLAB_DEPENDENCY_PROXY_ADDRESS}ruby:${RUBY_VERSION}-alpine
  timeout: 30m
  variables:
    # Both the Workflow API/GraphQL token (for the SSOT-author lookup) and the REST token (for MR creation) come from
    # the same service-account PAT.
    GITLAB_TOKEN: $AGENT_PRINCIPLES_SERVICE_ACCOUNT_TOKEN
    GITLAB_API_TOKEN: $AGENT_PRINCIPLES_SERVICE_ACCOUNT_TOKEN
    AGENT_PRINCIPLES_CATALOG_PROJECT: gitlab-org/gitlab
    BUNDLE_PATH: vendor
  before_script:
    - !reference [.ai-principles-setup, before_script]
  script:
    - bundle exec bin/gitlab-ai-principles-distiller-sync --workspace "$CI_PROJECT_DIR"
      --collect "$AI_PRINCIPLES_EXPECTED" --push
  artifacts:
    when: always
    expire_in: 7d
    paths:
      - .ai/principles/distilled/
    reports:
      # Lets ai-principles-report name the affected principles.
      # Written on every run that reaches collection, including clean ones, so the uploader always has a file to pick
      # up.
      dotenv: tmp/ai-principles-run.env

# Slack reporting lives in the CHILD pipeline because dotenv reports do not propagate from a child pipeline to its
# parent; keeping these in the parent would lose the per-principle names and regress to a generic message.
#
# There are two report jobs rather than one `when: always` job because the two abnormal outcomes differ in exit
# status, and a single job cannot key off the upstream job's status:
#
#   collect exits NON-ZERO  -> a principle failed after retries, or publishing
#                              itself failed          -> ai-principles-report-failure
#   collect exits ZERO      -> healthy, but some distill jobs may never have
#                              run (by design, not a failure)
#                                                     -> ai-principles-report-incomplete
#
# scripts/slack no-ops gracefully when CI_SLACK_WEBHOOK_URL is unset.
.ai-principles-report-base:
  stage: collect
  needs:
    - job: ai-principles-collect
      artifacts: true
  image: ${GITLAB_DEPENDENCY_PROXY_ADDRESS}alpine:latest
  cache: {}
  allow_failure: true
  before_script:
    - apk add --no-cache curl

# The failure path.
# FAILED_NAMES is only non-empty when individual principles failed after retries, so the message falls back to generic
# wording for any other failure mode (a publish/API failure, or an early crash before the dotenv report was written).
ai-principles-report-failure:
  extends: .ai-principles-report-base
  when: on_failure
  script:
    - |
      if [ -n "${AI_PRINCIPLES_FAILED_NAMES}" ]; then
        MSG="☠️ Weekly AI principles distillation partially failed: ${AI_PRINCIPLES_FAILED_COUNT} principle(s) failed after retries (${AI_PRINCIPLES_FAILED_NAMES}); ${AI_PRINCIPLES_PUBLISHED_COUNT} published. The failed principles stay stale until the next scheduled run. See ${CI_PIPELINE_URL}"
      else
        MSG="☠️ Weekly AI principles distillation failed. Distilled principles may be stale. See ${CI_PIPELINE_URL}"
      fi
      scripts/slack ai-harness-gitlab-monolith "${MSG}" ci_failing "GitLab Bot"

# The healthy-but-incomplete path: everything that ran succeeded and was published, but some distill jobs produced no
# result (runner outage, a job hitting its own 2h timeout, or the pipeline being canceled).
# That exits zero by design (those principles keep their checksums and are re-attempted next run), so it needs its own
# `on_success` job to be visible at all.
#
# Exits early with no message on a fully clean run, so this is not weekly noise.
ai-principles-report-incomplete:
  extends: .ai-principles-report-base
  when: on_success
  script:
    - |
      if [ -z "${AI_PRINCIPLES_NOT_RUN_NAMES}" ]; then
        echo "Clean run (${AI_PRINCIPLES_PUBLISHED_COUNT:-0} published); nothing to report."
        exit 0
      fi
      MSG="⚠️ Weekly AI principles distillation was incomplete: ${AI_PRINCIPLES_NOT_RUN_COUNT} principle(s) produced no distill result (${AI_PRINCIPLES_NOT_RUN_NAMES}); ${AI_PRINCIPLES_PUBLISHED_COUNT} published. Not a distillation failure: they are re-attempted next run. See ${CI_PIPELINE_URL}"
      scripts/slack ai-harness-gitlab-monolith "${MSG}" ci_failing "GitLab Bot"
