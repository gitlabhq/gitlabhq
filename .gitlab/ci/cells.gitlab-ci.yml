cells-routes:up-to-date:
  variables:
    SETUP_DB: "false"
  extends:
    - .default-retry
    - .ruby-cache
    - .default-before_script
    - .cells:rules:routes-up-to-date
  stage: lint
  needs:
    - job: cache:ruby-gems
      optional: true
  script:
    - bundle exec rake gitlab:cells:routes:updated_check
  artifacts:
    expire_in: 7 days
    name: gitlab-routes-snapshot
    paths:
      - config/routing/gitlab_routes.json
    when: on_failure

cells-routes:router-in-sync:
  # No bundle: gitlab-cells-http_router has no runtime dependencies, so the script
  # loads it from gems/ with plain Ruby and the job needs nothing installed.
  extends:
    - .default-retry
    - .with-alpine-ruby-image
    - .cells:rules:routes-router-in-sync
  stage: lint
  needs: []
  allow_failure: true
  script:
    - scripts/cells/check_router_routes_sync.rb
