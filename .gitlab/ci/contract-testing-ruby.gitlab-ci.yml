##############################################################
# Contract testing — Ruby consumer contracts
#
# Each service has its own CI job that:
#   1. Runs only that service's specs under
#      spec/contracts/consumer/external/specs/<service_dir>/
#      (directory names use underscores, e.g. artifact_registry/)
#   2. Uploads the generated contracts to GCS via the uploader.
#      Contract filenames use hyphens
#      (e.g. gitlab-rails-artifact-registry-repositories-get.json).
#      GCS slugs use underscores, matching the directory name
#      (e.g. artifact_registry/).
#
# To add a new service: add a new job following the pattern below.
# No changes to the uploader script are needed.
#
# This job runs on every push to a stable branch so contracts stay
# up to date with backport changes. The GitLab version is extracted
# from the branch name (e.g. '18-0-stable-ee' -> '18.0') via
# CI_COMMIT_REF_NAME. This job only runs in the
# canonical gitlab-org/gitlab project.
##############################################################

.contract-testing-ruby:rules:publish-consumer-contracts:
  rules:
    - if: '$CI_SERVER_HOST == "gitlab.com" && $CI_PROJECT_PATH == "gitlab-org/gitlab" && $CI_COMMIT_REF_NAME =~ /^[\d-]+-stable-ee$/'

.contract-testing-ruby:base:
  extends:
    - .contract-testing-ruby:rules:publish-consumer-contracts
  stage: post-test
  image: ${REGISTRY_HOST}/${REGISTRY_GROUP}/gitlab-build-images:${BUILD_OS}-${OS_VERSION}-ruby-${RUBY_VERSION}
  variables:
    GCS_BUCKET: "gitlab-rails-consumer-contracts"
  before_script:
    - bundle install --jobs=$(nproc) --retry=3
  # Publishing contracts is informational and must not block a release pipeline.
  # A GCS auth blip or network error can be recovered by re-running the job manually.
  allow_failure: true

publish-artifact-registry-consumer-contracts:
  extends:
    - .contract-testing-ruby:base
  script:
    - bundle exec rspec spec/contracts/consumer/external/specs/artifact_registry/ --format documentation
    - ruby spec/contracts/consumer/scripts/upload_contracts_to_gcs.rb
  artifacts:
    name: artifact-registry-consumer-contracts
    expire_in: 7 days
    paths:
      - spec/contracts/contracts/external/artifact_registry/
    when: always
