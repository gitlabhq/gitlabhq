# Known application errors that feature specs may still log to the browser console.
#
# The after-example hook in spec/support/capybara.rb fails an example on any SEVERE console
# message that BROWSER_CONSOLE_ERROR_FILTER does not ignore, unless an entry here allows it.
#
# Keys:
#   message: plain text that occurs in the console message (required). The comparison ignores
#            the URL and line prefix, quotes and backslashes. An empty message allows a console
#            error that has no text, such as an error object logged without a message.
#   messages: a list of such texts instead of message. It matches the same number of console
#            messages logged in a row, such as vue-apollo GraphQL errors, which Chrome logs as a
#            text and an Object.
#   specs:   spec file paths or globs the entry applies to (required)
#   issue:   full URL of the issue that tracks the fix (optional)
#
# Baseline from pipelines 2867610835 and 2881995978 of
# https://gitlab.com/gitlab-org/gitlab/-/merge_requests/256639 and pipelines 2867469601 and
# 2872215632 of https://gitlab.com/gitlab-org/gitlab/-/merge_requests/255199.
# Remove an entry when the error is fixed. spec/support_specs/browser_console_allowlist_spec.rb
# validates this file.
