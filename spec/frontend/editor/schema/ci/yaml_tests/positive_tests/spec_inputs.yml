# Global component: spec section with inputs
spec:
  description: "Builds and publishes the project"
  component: ["name", "sha", "version", "reference"]
  include:
    - local: "inputs/common.yml"
    - project: "group/project"
      file: "inputs/shared.yml"
      ref: "main"
    - remote: "https://gitlab.com/example/-/raw/main/inputs.yml"
      cache: true
    - remote: "https://gitlab.com/example/-/raw/main/other-inputs.yml"
      cache: "1 day"
      integrity: "sha256-ChmuF9dGyFCsA9tIcMuiFc8vGDagbG9EAMGoVCLKfNQ="
  inputs:
    string_input:
      type: string
      description: "String input"
    number_input:
      type: number
      description: "Number input"
    boolean_input:
      type: boolean
      description: "Boolean input"
    array_input:
      type: array
      description: "Array input"
    framework:
      default: "rails"
      description: "Framework to use"
      options: ["rails", "sinatra", "hanami"]
    stage_by_branch:
      description: "Stage chosen by branch"
      rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          options: ["deploy", "test"]
          default: "deploy"
        - options: ["test"]
          default: "test"

# Global component: include with inputs
include:
  - local: "template.yml"
    inputs:
      environment: "production"
      version: "v2.0.0"
      debug: false
      workers: 4

# Job: trigger with downstream inputs
trigger_job:
  trigger:
    project: "group/project"
    strategy: depend
    inputs:
      environment: "production"
      version: "v2.1.0"
      debug: false
      matrix:
        - browser: "chrome"
          device: "desktop"

# Job: trigger with child pipeline inputs
child_pipeline_job:
  trigger:
    include:
      - local: "child.yml"
        inputs:
          environment: "staging"
          version: "v1.5.0"
      - project: "group/project"
        file: "template.yml"
        inputs:
          debug: true
          workers: 8
