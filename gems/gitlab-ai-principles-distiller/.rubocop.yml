inherit_from:
  - ../config/rubocop.yml

Rails/Output:
  Enabled: false

# Bundler does not accept the GitLab-specific `feature_category` option without the root Gemfile's monkeypatch.
Gemfile/MissingFeatureCategory:
  Enabled: false

# This standalone gem does not load ActiveSupport, which provides `exclude?`.
Rails/NegateInclude:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Max: 10

# Spec helpers intentionally keep temporary-directory state on the example instance.
Gitlab/ModuleWithInstanceVariables:
  Exclude:
    - 'spec/**/*.rb'

# The shared test harness sets and restores CI_DEFAULT_BRANCH around each example.
RSpec/EnvAssignment:
  Exclude:
    - 'spec/spec_helper.rb'
