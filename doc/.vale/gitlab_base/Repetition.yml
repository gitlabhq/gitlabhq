---
name: gitlab_base.Repetition
description: |
  Checks for duplicate words, like `the the` or `and and`.
extends: repetition
message: "Remove this duplicate word: '%s'."
vocab: false
level: error
alpha: true
tokens:
  - '[^\s]+'
# To avoid some false positive where UI text has 'Select' or 'Enable' in it.
exceptions:
  - Select Select
  - Enable Enable
