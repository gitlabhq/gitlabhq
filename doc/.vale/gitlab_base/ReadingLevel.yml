---
name: gitlab_base.ReadingLevel
description: |
  Checks the Flesch-Kincaid reading level. The "> 1" condition ensures every file
  produces a score for the quarterly content audit, not just content above grade 8.
extends: metric
message: "The grade level is %s. Aim for 8th grade or lower by using shorter sentences and words."
link: https://docs.gitlab.com/development/documentation/testing/vale/#readability-score
level: suggestion
formula: |
  (0.39 * (words / sentences)) + (11.8 * (syllables / words)) - 15.59
condition: "> 1"
