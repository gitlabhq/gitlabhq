# yaml-language-server: $schema=https://gitlab.com/gitlab-org/caproni/-/raw/main/schema/config.v2.schema.json
# CNG deploy rig for test-on-cng; the reasoning lives in README.md

version: 2

variables:
  # Spelled out at each use: caproni variables cannot reference each other
  BASE_DOMAIN: cng.test
  # A cached package when the job found one, else the chart project's archive
  CHART: ${GITLAB_CHART_PACKAGE:-https://gitlab.com/gitlab-org/charts/gitlab/-/archive/${GITLAB_HELM_CHART_REF:?set GITLAB_HELM_CHART_REF or GITLAB_CHART_PACKAGE}/gitlab-${GITLAB_HELM_CHART_REF}.tar.gz}
  # Pinned: an unpinned dependency in the deploy path can break master
  GL_CNPG_VERSION: "0.29.0"
  GL_DEV_STACK_VERSION: "1.6.0"
  # build-cng-env omits *_TAG when its image lookup fails; CNG then tags these by *_VERSION
  CNG_GITALY_TAG: ${GITALY_TAG:-${GITALY_SERVER_VERSION:?set GITALY_TAG or GITALY_SERVER_VERSION}}
  CNG_GITLAB_SHELL_TAG: ${GITLAB_SHELL_TAG:-${GITLAB_SHELL_VERSION:?set GITLAB_SHELL_TAG or GITLAB_SHELL_VERSION}}
  CNG_KAS_TAG: ${GITLAB_KAS_TAG:-${GITLAB_KAS_VERSION:?set GITLAB_KAS_TAG or GITLAB_KAS_VERSION}}
  CNG_TOOLBOX_TAG: ${GITLAB_TOOLBOX_TAG:-${CI_COMMIT_SHA:?set CI_COMMIT_SHA or GITLAB_TOOLBOX_TAG}}
  CNG_SIDEKIQ_TAG: ${GITLAB_SIDEKIQ_TAG:-${CI_COMMIT_SHA:?set CI_COMMIT_SHA or GITLAB_SIDEKIQ_TAG}}
  CNG_WEBSERVICE_TAG: ${GITLAB_WEBSERVICE_TAG:-${CI_COMMIT_SHA:?set CI_COMMIT_SHA or GITLAB_WEBSERVICE_TAG}}
  CNG_WORKHORSE_TAG: ${GITLAB_WORKHORSE_TAG:-${CI_COMMIT_SHA:?set CI_COMMIT_SHA or GITLAB_WORKHORSE_TAG}}
  CNG_REGISTRY_TAG: ${GITLAB_CONTAINER_REGISTRY_TAG:-${CI_COMMIT_SHA:?set CI_COMMIT_SHA or GITLAB_CONTAINER_REGISTRY_TAG}}

deployers:
  # gitlab-dev-stack writes its secrets here, so create it first
  prerequisites:
    type: namespace
    namespace:
      namespaces:
        - gitlab

  # Gitaly server hook the E2E suite expects; a kustomize apply does not create namespaces
  pre-receive-hook:
    type: kustomize
    needs: [prerequisites]
    kustomize:
      path: ./manifests/pre-receive-hook

  cloudnative-pg:
    type: helm
    helm:
      namespace: cnpg-system
      wait: true
      repository:
        name: cnpg
        url: https://cloudnative-pg.github.io/charts
      release:
        name: cloudnative-pg
        chart: cnpg/cloudnative-pg
        version: ${GL_CNPG_VERSION}
      dynamic_overrides:
        - type: inline
          value_map:
            crds.create: true

  gitlab-dev-stack:
    type: helm
    needs: [prerequisites, cloudnative-pg]
    helm:
      namespace: gitlab-dev-stack
      wait: true
      timeout: 10m
      values_file: ./values/gitlab-dev-stack.yaml
      release:
        name: gitlab-dev-stack
        chart: oci://registry.gitlab.com/gitlab-org/cloud-native/charts/gitlab-dev-stack/gitlab-dev-stack:${GL_DEV_STACK_VERSION}

  gitlab:
    type: helm
    needs: [prerequisites, gitlab-dev-stack, pre-receive-hook]
    helm:
      namespace: gitlab
      values_file: ./values/gitlab.yaml
      # 10m rather than 5m: Caproni has no deploy retry
      wait: true
      timeout: 10m
      release:
        name: gitlab
        # Never swap this for a published chart version -- see README
        chart: ${CHART}
      dynamic_overrides:
        - type: inline
          value_map:
            global.hosts.domain: ${BASE_DOMAIN}

            # Gateway API: the chart default since 19.0, Ingress goes in 20.0
            global.gatewayApi.enabled: true
            global.ingress.enabled: false
            # The chart supplies Envoy; the rig adds no proxy of its own
            global.gatewayApi.installEnvoy: true
            global.gatewayApi.configureCertmanager: false
            gatewayApiResources.gateway.protocol: HTTP

            gitlab.gitaly.image.repository: registry.gitlab.com/gitlab-org/build/cng-mirror/gitaly
            gitlab.gitaly.image.tag: ${CNG_GITALY_TAG}
            gitlab.gitlab-shell.image.repository: registry.gitlab.com/gitlab-org/build/cng-mirror/gitlab-shell
            gitlab.gitlab-shell.image.tag: ${CNG_GITLAB_SHELL_TAG}
            gitlab.migrations.image.repository: registry.gitlab.com/gitlab-org/build/cng-mirror/gitlab-toolbox-ee
            gitlab.migrations.image.tag: ${CNG_TOOLBOX_TAG}
            gitlab.toolbox.image.repository: registry.gitlab.com/gitlab-org/build/cng-mirror/gitlab-toolbox-ee
            gitlab.toolbox.image.tag: ${CNG_TOOLBOX_TAG}
            gitlab.sidekiq.image.repository: registry.gitlab.com/gitlab-org/build/cng-mirror/gitlab-sidekiq-ee
            gitlab.sidekiq.image.tag: ${CNG_SIDEKIQ_TAG}
            gitlab.sidekiq.annotations.commit: ${CI_COMMIT_SHORT_SHA}
            gitlab.webservice.image.repository: registry.gitlab.com/gitlab-org/build/cng-mirror/gitlab-webservice-ee
            gitlab.webservice.image.tag: ${CNG_WEBSERVICE_TAG}
            gitlab.webservice.annotations.commit: ${CI_COMMIT_SHORT_SHA}
            gitlab.webservice.workhorse.image: registry.gitlab.com/gitlab-org/build/cng-mirror/gitlab-workhorse-ee
            gitlab.webservice.workhorse.tag: ${CNG_WORKHORSE_TAG}
            gitlab.kas.image.repository: registry.gitlab.com/gitlab-org/build/cng-mirror/gitlab-kas
            gitlab.kas.image.tag: ${CNG_KAS_TAG}
            gitlab.registry.image.repository: registry.gitlab.com/gitlab-org/build/cng-mirror/gitlab-container-registry
            gitlab.registry.image.tag: ${CNG_REGISTRY_TAG}

cluster:
  driver: k3d
  network:
    hostname: gitlab.${BASE_DOMAIN}
    # Local /etc/hosts only; CI uses nip.io and needs none of this
    additional_hostnames:
      - registry.${BASE_DOMAIN}
      - kas.${BASE_DOMAIN}
  k3d:
    servers: 1
    image: rancher/k3s:v1.34.9-k3s1
    k3s:
      # k3s's Traefik would fight the chart's Envoy for ports 80 and 22
      disable:
        - traefik
    port_mappings:
      - "80:80@loadbalancer"
      - "22:22@loadbalancer"

  # No registry_mirror: the job's dind cache starts empty every run anyway
