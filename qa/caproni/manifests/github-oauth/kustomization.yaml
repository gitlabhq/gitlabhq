# Applied by the github-oauth-secret deployer in caproni.github-oauth.yaml.
# provider.yaml is generated by that deployer's `files:` at build time.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitlab

# The chart looks the secret up by this exact name
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: gitlab-oauth-github
    files:
      - provider=provider.yaml
