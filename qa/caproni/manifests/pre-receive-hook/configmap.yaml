# Ported verbatim from the orchestrator's Configurations::Kind::PRE_RECEIVE_HOOK.
# qa/qa/specs/features/api/3_create/repository/tag_revision_trigger_prereceive_hook_spec.rb
# pushes to a project path matching reject-prereceive and expects this error.
apiVersion: v1
kind: ConfigMap
metadata:
  # The chart mounts this by name; keep it stable
  name: pre-receive-hook
  namespace: gitlab
data:
  hook.sh: |
    #!/usr/bin/env bash

    if [[ $GL_PROJECT_PATH =~ 'reject-prereceive' ]]; then
      echo 'GL-HOOK-ERR: Custom error message rejecting prereceive hook for projects with GL_PROJECT_PATH matching pattern reject-prereceive'
      exit 1
    fi
