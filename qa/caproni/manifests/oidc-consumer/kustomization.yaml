# Applied by the oidc-consumer-secret deployer in caproni.oidc-consumer.yaml.
# openid_connect.yaml and gitlab.yaml are generated by that deployer's `files:` at build time.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitlab

# The chart looks the secret up by this exact name
generatorOptions:
  disableNameSuffixHash: true

# One key per omniauth provider, each referenced by global.appConfig.omniauth.providers
secretGenerator:
  - name: gitlab-omniauth-consumer
    files:
      - openid_connect=openid_connect.yaml
      - gitlab=gitlab.yaml
