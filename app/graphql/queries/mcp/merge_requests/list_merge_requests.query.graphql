# @feature_category: mcp_server
query listMergeRequests(
  $fullPath: ID!
  $isProject: Boolean!
  $authorUsername: String
  $assigneeUsername: String
  $reviewerUsername: String
  $state: MergeRequestState
  $milestoneTitle: String
  $labelName: [String]
  $search: String
  $first: Int
  $after: String
) {
  project(fullPath: $fullPath) @include(if: $isProject) {
    id
    mergeRequests(
      authorUsername: $authorUsername
      assigneeUsername: $assigneeUsername
      reviewerUsername: $reviewerUsername
      state: $state
      milestoneTitle: $milestoneTitle
      labelName: $labelName
      search: $search
      first: $first
      after: $after
    ) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        ...MergeRequestFields
      }
    }
  }
  group(fullPath: $fullPath) @skip(if: $isProject) {
    id
    mergeRequests(
      includeSubgroups: true
      authorUsername: $authorUsername
      assigneeUsername: $assigneeUsername
      reviewerUsername: $reviewerUsername
      state: $state
      milestoneTitle: $milestoneTitle
      labelName: $labelName
      search: $search
      first: $first
      after: $after
    ) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        ...MergeRequestFields
        project {
          id
          fullPath
        }
      }
    }
  }
}

fragment MergeRequestFields on MergeRequest {
  id
  iid
  title
  state
  webUrl
  sourceBranch
  targetBranch
  author {
    id
    username
  }
}
