# @feature_category: portfolio_management
# Only selects `id` — the moved card's display fields come from the node
# already cached by the board, which board_view's cache update reinserts into
# the column. No need to fetch the full WorkItem again here.
mutation updateBoardWorkItem($input: WorkItemUpdateInput!) {
  workItemUpdate(input: $input) {
    workItem {
      id
    }
    errors
  }
}
