#import "./work_item_linked_resources.fragment.graphql"

# @feature_category: team_planning
subscription workItemLinkedResourcesUpdated(
  $id: WorkItemID!
  $useWorkItemFeatures: Boolean = false
) {
  workItemUpdated(workItemId: $id) {
    id
    widgets @skip(if: $useWorkItemFeatures) {
      ...WorkItemLinkedResources
    }
    features @include(if: $useWorkItemFeatures) {
      linkedResources {
        ...WorkItemLinkedResources
      }
    }
  }
}
