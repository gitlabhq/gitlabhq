# @feature_category: notifications
# The issuable alias matches issue_comment_todos.query.graphql
# so note_actions.vue can read both responses with the same update hook.
query mergeRequestCommentTodos($id: MergeRequestID!) {
  issuable: mergeRequest(id: $id) {
    id
    currentUserTodos(state: pending) {
      nodes {
        id
        note {
          id
        }
      }
    }
  }
}
