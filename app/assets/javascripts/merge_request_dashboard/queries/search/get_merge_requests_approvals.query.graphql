#import "ee_else_ce/merge_request_dashboard/queries/merge_request_approval.fragment.graphql"

# @feature_category: code_review_workflow
query getDashboardMergeRequestsApprovals(
  $sort: MergeRequestSort
  $state: MergeRequestState
  $approvedBy: [String!]
  $assigneeUsernames: [String!]
  $assigneeWildcardId: AssigneeWildcardId
  $reviewerUsername: String
  $reviewerWildcardId: ReviewerWildcardId
  $authorUsername: String
  $draft: Boolean
  $labelName: [String!]
  $mergeUser: String
  $milestoneTitle: String
  $milestoneWildcardId: MilestoneWildcardId
  $myReactionEmoji: String
  $subscribed: SubscriptionStatus
  $mergedBefore: Time
  $mergedAfter: Time
  $not: MergeRequestsResolverNegatedParams
  $or: UnionedMergeRequestFilterInput
  $beforeCursor: String
  $afterCursor: String
  $firstPageSize: Int
  $lastPageSize: Int
) {
  mergeRequests(
    sort: $sort
    state: $state
    approvedBy: $approvedBy
    assigneeUsernames: $assigneeUsernames
    assigneeWildcardId: $assigneeWildcardId
    reviewerUsername: $reviewerUsername
    reviewerWildcardId: $reviewerWildcardId
    authorUsername: $authorUsername
    draft: $draft
    labelName: $labelName
    mergedBy: $mergeUser
    milestoneTitle: $milestoneTitle
    milestoneWildcardId: $milestoneWildcardId
    myReactionEmoji: $myReactionEmoji
    subscribed: $subscribed
    mergedBefore: $mergedBefore
    mergedAfter: $mergedAfter
    not: $not
    or: $or
    before: $beforeCursor
    after: $afterCursor
    first: $firstPageSize
    last: $lastPageSize
  ) {
    nodes {
      id
      ...MergeRequestApprovalFragment
    }
  }
}
