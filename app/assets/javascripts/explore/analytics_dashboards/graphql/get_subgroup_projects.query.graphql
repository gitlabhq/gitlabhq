# @feature_category: custom_dashboards_foundation

# Flattens the whole tree beneath the group: `includeSubgroups` reaches projects at any depth,
# and each carries its own `namespace` so a row can name the subgroup it actually sits in.
query getAnalyticsDashboardSubgroupProjects($fullPath: ID!) {
  group(fullPath: $fullPath) {
    id
    projects(first: 20, sort: ACTIVITY_DESC, includeArchived: false, includeSubgroups: true) {
      nodes {
        id
        name
        fullName: nameWithNamespace
        fullPath
        namespace {
          id
          name
          fullPath
        }
      }
    }
  }
}
