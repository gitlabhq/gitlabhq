# @feature_category: custom_dashboards_foundation

#import "ee_else_ce/explore/analytics_dashboards/graphql/fragments/scope_project_permissions.fragment.graphql"

# Flattens the whole tree beneath the group: `includeSubgroups` reaches projects at any depth,
# and each carries its own `namespace` so a row can name the subgroup it actually sits in.
query getAnalyticsDashboardSubgroupProjects($fullPath: ID!, $after: String) {
  group(fullPath: $fullPath) {
    id
    projects(
      first: 20
      after: $after
      sort: ACTIVITY_DESC
      includeArchived: false
      includeSubgroups: true
    ) {
      nodes {
        id
        name
        fullName: nameWithNamespace
        fullPath
        ...AnalyticsDashboardScopeProjectPermissions
        namespace {
          id
          name
          fullPath
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
