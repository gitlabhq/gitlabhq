# @feature_category: custom_dashboards_foundation

# The scope picker's starting point when it has no group to browse within, as on the
# instance-level Explore page. `allAvailable: false` limits this to groups the user belongs to.
#
# Every connection the picker opens is capped at 20, browse and search alike, since a dropdown
# cannot usefully show more. `Load more` is tracked in
# https://gitlab.com/gitlab-org/gitlab/-/work_items/627465.
query getAnalyticsDashboardTopLevelGroups {
  groups(topLevelOnly: true, allAvailable: false, sort: "name_asc", first: 20) {
    nodes {
      id
      name
      fullName
      fullPath
      projectsCount
    }
  }
}
