subscription getStateSubscription($issuableId: IssuableID!) {
  mergeRequestMergeStatusUpdated(issuableId: $issuableId) {
    ... on MergeRequest {
      id
      detailedMergeStatus
      commitCount
      availableAutoMergeStrategies
      autoMergeEnabled
      userPermissions {
        canMerge
      }
      mergeabilityChecks {
        identifier
        status
      }
    }
  }
}
