query getUserAchievements($id: UserID!) {
  user(id: $id) {
    id
    userAchievements {
      nodes {
        id
        createdAt
        awardMessageHtml
        achievement {
          id
          name
          description
          avatarUrl
          namespace {
            id
            fullPath
            achievementsPath
          }
        }
      }
    }
  }
}
