description: Command is executed from the GitLab CLI
internal_events: true
action: gitlab_cli_command_used
identifiers:
  - project
  - namespace
  - user
additional_properties:
  label:
    description: Command used - e.g. 'mr'
  property:
    description: Subcommand used - e.g. 'view'
  command_and_subcommand:
    description: Command and subcommand used - e.g. 'mr view'
  coding_agent:
    description: AI coding agent driving the CLI - e.g. 'claude-code', 'codex', 'cursor'. Omitted when no agent was detected.
  cli_version:
    description: Version of the glab binary - e.g. 'v1.116.0'
  platform:
    description: Operating system the binary was built for - e.g. 'darwin', 'linux'
  architecture:
    description: Architecture the binary was built for - e.g. 'arm64', 'amd64'
  api_endpoint:
    description: For 'glab api' only, the templated API route called - e.g. '/projects/{}/merge_requests'. Matched against a known route table; unrecognised paths are reported as 'unmatched' so raw paths are never sent.
  http_method:
    description: For 'glab api' only, the HTTP method of the request - e.g. 'GET', 'POST'
product_group: code_review
product_categories:
  - gitlab_cli
milestone: '18.0'
introduced_by_url: https://gitlab.com/gitlab-org/gitlab/-/merge_requests/185183
tiers:
  - free
  - premium
  - ultimate
