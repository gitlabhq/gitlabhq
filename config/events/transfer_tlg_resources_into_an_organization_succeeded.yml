---
description: Fires when the background job finishes transferring top-level group resources
  into an organization and the organization is activated
internal_events: true
status: active
action: transfer_tlg_resources_into_an_organization_succeeded
identifiers:
- user
additional_properties:
  target_organization_id:
    description: ID of the organization the resources were transferred into.
      Differs from the standard context `organization_id`, which holds the
      organization the request originated from
  value:
    description: Number of groups, including subgroups, belonging to the organization
      once the transfer finished
  projects_count:
    description: Number of projects belonging to the organization once the transfer
      finished
  users_count:
    description: Number of users belonging to the organization once the transfer finished
product_group: organizations
product_categories:
- organization
milestone: '19.4'
introduced_by_url: https://gitlab.com/gitlab-org/gitlab/-/merge_requests/254597
tiers:
- free
- premium
- ultimate
