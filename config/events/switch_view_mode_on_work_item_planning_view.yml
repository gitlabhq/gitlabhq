description: Fires when a user switches the work item planning view between list mode and board mode using the view mode toggle in the display settings drawer. The label is the mode being switched to, either list or board, and this only fires for deliberate switches through the toggle, not when a page loads directly into board mode. Because of this, the list direction is the only signal available for users who try the board and switch back, which matters for gauging adoption during the beta.
