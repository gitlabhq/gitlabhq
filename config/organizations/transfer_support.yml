# Organization transfer support registry
#
# This file tracks which organization-sharded tables have been updated
# to support organization transfers.
#
# Valid statuses:
#   supported      - Transfer logic is implemented and tested
#   todo           - Transfer support has not yet been implemented (legacy tables only)
#   no_work_needed - Table requires no changes for organization transfers
#
# New organization-sharded tables MUST use 'supported'. The 'todo' status is
# only allowed for tables that existed before this tracking system was introduced.
#
# Tables are sorted alphabetically. Add new entries in sort order to avoid
# merge conflicts.
#
# Owned by @gitlab-com/gl-infra/tenant-scale/organizations/backend-engineers
# Changes to this file do NOT require a database review.
