---
name: mr_diff_commits_read_new_table
description: |
  The commit query shape follows whether `merge_request_diff_commits` is partitioned, so this flag only
  gates whether that check runs. Enable it fully before the table swap, and never disable it afterwards:
  with the swap done and the flag off, queries reference columns the partitioned table does not have.
