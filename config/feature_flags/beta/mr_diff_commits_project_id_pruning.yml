---
name: mr_diff_commits_project_id_pruning
description: |
  Shapes merge request diff commit queries to include project_id, so PostgreSQL can prune partitions once the commits
  table is partitioned. Enabling it before the commits table is partitioned will filter on an unpopulated project_id,
  silently returning incomplete commit lists.
feature_issue_url: https://gitlab.com/gitlab-org/gitlab/-/work_items/594699
introduced_by_url: https://gitlab.com/gitlab-org/gitlab/-/merge_requests/240394
rollout_issue_url: https://gitlab.com/gitlab-org/gitlab/-/work_items/604357
milestone: '19.3'
group: group::code review
type: beta
default_enabled: false
