# This template is for testing cutting-edge features.
# It is not considered stable and might include breaking changes that are planned for the next major release.
# For more information: https://docs.gitlab.com/user/application_security/detect/roll_out_security_scanning/#template-editions

# Read more about this feature here: https://docs.gitlab.com/ee/user/application_security/secret_detection
#
# Configure the scanning tool through the environment variables.
# List of the variables: https://docs.gitlab.com/ee/user/application_security/secret_detection/#available-variables
# How to set: https://docs.gitlab.com/ee/ci/yaml/#variables

variables:
  # Setting these variables affect all Security templates
  # (SAST, Dependency Scanning, ...)
  SECURE_ANALYZERS_PREFIX: "$CI_TEMPLATE_REGISTRY_HOST/security-products"
  AST_ENABLE_MR_PIPELINES: "true"
  #
  SECRET_DETECTION_IMAGE_SUFFIX: ""
  SECRETS_ANALYZER_VERSION: "7"
  SECRET_DETECTION_EXCLUDED_PATHS: ""
  SECRETS_ANALYZER_IMAGE: "$SECURE_ANALYZERS_PREFIX/secrets:$SECRETS_ANALYZER_VERSION$SECRET_DETECTION_IMAGE_SUFFIX"
  # The GitLab Secret Scanning for Source Code analyzer is in beta. It is enabled by setting
  # SECRET_DETECTION_ENABLE_GSS to "true" and is pinned to the rolling `edge` tag until a stable version
  # is released.
  GSS_ANALYZER_IMAGE: "$SECURE_ANALYZERS_PREFIX/gitlab-advanced-secrets:edge$SECRET_DETECTION_IMAGE_SUFFIX"
  SECRET_DETECTION_GSS_ENABLE_GENERIC_SECRETS: "true"

.secret-analyzer:
  stage: test
  image: "$SECRETS_ANALYZER_IMAGE"
  services: []
  allow_failure: true
  variables:
    GIT_DEPTH: "50"
  # `rules` must be overridden explicitly by each child job
  # see https://gitlab.com/gitlab-org/gitlab/-/issues/218444
  artifacts:
    access: 'developer'
    reports:
      secret_detection: gl-secret-detection-report.json
    paths: [gl-secret-detection-report.json]
  cache: []

secret_detection:
  extends: .secret-analyzer
  rules:
    - if: $SECRET_DETECTION_DISABLED == 'true' || $SECRET_DETECTION_DISABLED == '1'
      when: never

    # The following blocks of rules define whether the job runs in an *MR pipeline* or a *branch pipeline*
    # when an MR exists. If the job has additional rules to observe they should be added in the blocks that
    # cover both the *MR pipeline* and the *branch pipeline* workflows.
    #
    # When SECRET_DETECTION_ENABLE_GSS is "true", this job overrides its image to run the GitLab Secret
    # Scanning for Source Code analyzer instead of the default secrets analyzer. Because this is the same
    # job, the two analyzers never run in parallel.

    # 1. Run the job in an *MR* pipeline if MR pipelines for AST are enabled and there's an open merge request.
    - if: $AST_ENABLE_MR_PIPELINES == "true" &&
          $CI_PIPELINE_SOURCE == "merge_request_event" &&
          ($SECRET_DETECTION_ENABLE_GSS == 'true' || $SECRET_DETECTION_ENABLE_GSS == '1')
      variables:
        SECRETS_ANALYZER_IMAGE: "$GSS_ANALYZER_IMAGE"
    - if: $AST_ENABLE_MR_PIPELINES == "true" &&
          $CI_PIPELINE_SOURCE == "merge_request_event"
    # 2. Don't run the job in a *branch pipeline* if *MR pipelines* for AST are enabled and there's an open merge request.
    - if: $AST_ENABLE_MR_PIPELINES == "true" &&
          $CI_OPEN_MERGE_REQUESTS
      when: never
    # 3. Finally, run the job in a *branch pipeline* (When MR pipelines are disabled for AST, or it is enabled but no open MRs exist for the branch).
    - if: $CI_COMMIT_BRANCH &&
          ($SECRET_DETECTION_ENABLE_GSS == 'true' || $SECRET_DETECTION_ENABLE_GSS == '1')
      variables:
        SECRETS_ANALYZER_IMAGE: "$GSS_ANALYZER_IMAGE"
    - if: $CI_COMMIT_BRANCH
  script:
    - /analyzer run
