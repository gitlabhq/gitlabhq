---
event: Organizations::GroupTransferredEvent
description: Published when a root group is transferred to a different organization.
  Fired once for the transferred group only - subscribers are responsible for traversing
  descendants if needed, and must not assume descendant namespaces or projects have
  moved yet. Published by Organizations::Transfer::TopLevelGroupService, which moves
  the root group row only, and by Organizations::Transfer::GroupsService, which moves
  the root group and its descendants. Not emitted when the surrounding transaction is
  rolled back, and not published when the group already belongs to the target organization.
  The Organizations::ConfirmService path emits it twice for the same root group, once per
  service, so subscribers must be idempotent.
feature_category: organization
